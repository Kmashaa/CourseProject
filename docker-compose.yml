services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports:
      - "6379:6379"
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"] 
      interval: 5s 
      timeout: 5s 
      retries: 10


  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16-alpine
    container_name: eventapi-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

  events-db:
    image: postgres:16-alpine
    container_name: eventapi-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 5s
      timeout: 5s
      retries: 5

  bookings-db:
    image: postgres:16-alpine
    container_name: eventapi-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings
    ports:
      - "5434:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 5
 # ─────────────────────────── Микросервисы ───────────────────────────
  users-service:
    image: courseproject-users:latest
    container_name: courseproject-users-api
    build:
      context: . 
      dockerfile: CourseProject.Users.Presentation/Dockerfile
      no_cache: true  # Сборка без кеша
    pull_policy: build
    ports:
      - "7127:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=eventapi-users-db;Port=5432;Database=users;Username=postgres;Password=postgres
    depends_on:
      users-db:
        condition: service_healthy

  events-service:
    image: courseproject-events:latest
    container_name: courseproject-events-api
    build:
      context: .
      dockerfile: CourseProject.Events.Presentation/Dockerfile
      no_cache: true  # Сборка без кеша
    pull_policy: build
    ports:
      - "7128:8080"          # HTTP только
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=eventapi-events-db;Port=5432;Database=events;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=events-service-group
      - Jwt__Secret=your-super-secret-key-at-least-32-characters-long
      - Jwt__Issuer=CourseProject
      - Jwt__Audience=CourseProjectClients
      - Jwt__ExpirationMinutes=15
      - Redis__RedisConnection=redis:6379
      - Redis__LongTTL=15
      - Redis__ShortTTL=3
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  bookings-service:
    image: courseproject-bookings:latest
    container_name: courseproject-bookings-api
    build:
      context: .
      dockerfile: CourseProject.Bookings.Presentation/Dockerfile
      no_cache: true  # Сборка без кеша
    pull_policy: build
    ports:
      - "7129:8080"          # HTTP
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=eventapi-bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=bookings-service-group
      - Jwt__Secret=your-super-secret-key-at-least-32-characters-long
      - Jwt__Issuer=CourseProject
      - Jwt__Audience=CourseProjectClients
      - Jwt__ExpirationMinutes=15
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:

